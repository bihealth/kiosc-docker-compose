# Default configuration for PostgreSQL
x-postgres: &default-postgres
  image: postgres:16
  hostname: postgres
  environment:
    POSTGRES_USER: kiosc
    POSTGRES_PASSWORD: kiosc
    POSTGRES_DB: kiosc
  networks:
    - kiosc-public
  restart: unless-stopped
  volumes:
    - type: bind
      source: ./volumes/postgres/data
      target: /var/lib/postgresql/data
    - type: bind
      source: ./scripts/init.sql
      target: /docker-entrypoint-initdb.d/init.sql

# Default configuration for redis
x-redis: &default-redis
  image: redis:${REDIS_VERSION-8}
  networks:
    - kiosc-public
  restart: unless-stopped
  volumes:
    - type: bind
      source: ./volumes/redis/data
      target: /data

# Default configuration for Docker registry
x-kiosc-registry: &default-registry
  image: registry:3
  environment: &default-registry-environment
    REGISTRY_HTTP_SECRET: ${KIOSC_CUSTOM_REGISTRY_HTTP_SECRET}
    REGISTRY_NOTIFICATIONS_ENDPOINTS_0_HEADERS_AUTHORIZATION: "[\"Bearer ${KIOSC_CUSTOM_REGISTRY_NOTIFICATIONS_TOKEN}\"]"
    REGISTRY_NOTIFICATIONS_ENDPOINTS_0_URL: "${KIOSC_CUSTOM_REGISTRY_NOTIFICATIONS_URL}"
    REGISTRY_REDIS_ADDRS: "[${KIOSC_REDIS_URL}]"
  restart: unless-stopped
  volumes:
    - type: bind
      source: /var/lib/docker/registry
      target: /var/lib/registry
    - type: bind
      source: ./config/registry/config.yml
      target: /etc/distribution/config.yml
      read_only: true

# Default configuration for Kiosc Servers
x-kiosc: &default-kiosc
  image: ghcr.io/bihealth/kiosc-server:${KIOSC_SERVER_VERSION}
  environment: &default-kiosc-environment
    WAIT_HOSTS: "postgres:5432,redis:6379"
    LC_ALL: en_US.UTF-8
    # Kiosc configuration
    DATABASE_URL: ${KIOSC_DATABASE_URL}
    REDIS_URL: ${KIOSC_REDIS_URL}
    DJANGO_ALLOWED_HOSTS: ${KIOSC_DJANGO_ALLOWED_HOSTS}
    DJANGO_SECRET_KEY: ${KIOSC_DJANGO_SECRET_KEY}
    DJANGO_SETTINGS_MODULE: ${KIOSC_DJANGO_SETTINGS_MODULE}
    KIOSC_DOCKER_ACTION_MIN_DELAY: ${KIOSC_DOCKER_ACTION_MIN_DELAY}
    KIOSC_DOCKER_MAX_INACTIVITY: ${KIOSC_DOCKER_MAX_INACTIVITY}
    KIOSC_DOCKER_NETWORK: ${KIOSC_DOCKER_NETWORK}
    KIOSC_EMBEDDED_FILES: ${KIOSC_EMBEDDED_FILES}
    KIOSC_DOCKER_VOLUMES_DIR: ${KIOSC_DOCKER_VOLUMES_DIR}
    KIOSC_NETWORK_MODE: ${KIOSC_NETWORK_MODE}
    KIOSC_DATA_UPLOAD_MAX_MEMORY_SIZE: ${KIOSC_DATA_UPLOAD_MAX_MEMORY_SIZE}
    KIOSC_CUSTOM_REGISTRY_HTTP_URL: ${KIOSC_CUSTOM_REGISTRY_HTTP_URL}
    KIOSC_CUSTOM_REGISTRY_DOCKER_URL: ${KIOSC_CUSTOM_REGISTRY_DOCKER_URL}
    KIOSC_CUSTOM_REGISTRY_NOTIFICATIONS_TOKEN: ${KIOSC_CUSTOM_REGISTRY_NOTIFICATIONS_TOKEN}
    CELERY_BROKER_URL: ${KIOSC_CELERY_BROKER_URL}
    UVICORN_WORKERS: ${KIOSC_UVICORN_WORKERS}
    # LDAP auth
    ENABLE_LDAP: ${KIOSC_ENABLE_LDAP-0}
    LDAP_DEBUG: ${KIOSC_LDAP_DEBUG-0}
    AUTH_LDAP_SERVER_URI: ${KIOSC_AUTH_LDAP_SERVER_URI}
    AUTH_LDAP_BIND_PASSWORD: ${KIOSC_AUTH_LDAP_BIND_PASSWORD}
    AUTH_LDAP_BIND_DN: ${KIOSC_AUTH_LDAP_BIND_DN}
    AUTH_LDAP_USER_SEARCH_BASE: ${KIOSC_AUTH_LDAP_USER_SEARCH_BASE}
    AUTH_LDAP_USERNAME_DOMAIN: ${KIOSC_AUTH_LDAP_USERNAME_DOMAIN}
    AUTH_LDAP_DOMAIN_PRINTABLE: ${KIOSC_AUTH_LDAP_DOMAIN_PRINTABLE}
    AUTH_LDAP_START_TLS: ${KIOSC_AUTH_LDAP_START_TLS}
    AUTH_LDAP_CA_CERT_FILE: ${KIOSC_AUTH_LDAP_CA_CERT_FILE}
    AUTH_LDAP_USER_FILTER: ${KIOSC_AUTH_LDAP_USER_FILTER}
    ENABLE_LDAP_SECONDARY: ${KIOSC_ENABLE_LDAP_SECONDARY-0}
    AUTH_LDAP2_SERVER_URI: ${KIOSC_AUTH_LDAP2_SERVER_URI}
    AUTH_LDAP2_BIND_PASSWORD: ${KIOSC_AUTH_LDAP2_BIND_PASSWORD}
    AUTH_LDAP2_BIND_DN: ${KIOSC_AUTH_LDAP2_BIND_DN}
    AUTH_LDAP2_USER_SEARCH_BASE: ${KIOSC_AUTH_LDAP2_USER_SEARCH_BASE}
    AUTH_LDAP2_USERNAME_DOMAIN: ${KIOSC_AUTH_LDAP2_USERNAME_DOMAIN}
    AUTH_LDAP2_DOMAIN_PRINTABLE: ${KIOSC_AUTH_LDAP2_DOMAIN_PRINTABLE}
    AUTH_LDAP2_START_TLS: ${KIOSC_AUTH_LDAP2_START_TLS}
    AUTH_LDAP2_CA_CERT_FILE: ${KIOSC_AUTH_LDAP2_CA_CERT_FILE}
    AUTH_LDAP2_USER_FILTER: ${KIOSC_AUTH_LDAP2_USER_FILTER}
    LDAP_ALT_DOMAINS: ${KIOSC_LDAP_ALT_DOMAINS}
    # OIDC auth
    ENABLE_OIDC: ${KIOSC_ENABLE_OIDC-0}
    SOCIAL_AUTH_OIDC_OIDC_ENDPOINT: ${KIOSC_SOCIAL_AUTH_OIDC_OIDC_ENDPOINT}
    SOCIAL_AUTH_OIDC_KEY: ${KIOSC_SOCIAL_AUTH_OIDC_KEY}
    SOCIAL_AUTH_OIDC_SECRET: ${KIOSC_SOCIAL_AUTH_OIDC_SECRET}
    SOCIAL_AUTH_OIDC_USERNAME_KEY: ${KIOSC_SOCIAL_AUTH_OIDC_USERNAME_KEY-username}
    # Django-Axes configuration
    AXES_ENABLED: ${KIOSC_AXES_ENABLED-0}
    AXES_COOLOFF_TIME: ${KIOSC_AXES_COOLOFF_TIME}
    AXES_DISABLE_CLIENT_IP_STORAGE: ${KIOSC_AXES_DISABLE_CLIENT_IP_STORAGE}
    AXES_FAILURE_LIMIT: ${KIOSC_AXES_FAILURE_LIMIT}
    AXES_LOCK_OUT_AT_FAILURE: ${KIOSC_AXES_LOCK_OUT_AT_FAILURE}
    AXES_LOCKOUT_PARAMETERS: ${KIOSC_AXES_LOCKOUT_PARAMETERS}
    AXES_ONLY_ADMIN_SITE: ${KIOSC_AXES_ONLY_ADMIN_SITE}
    # Email settings
    ADMINALERTS_EMAIL_SENDING_DEFAULT: ${KIOSC_ADMINALERTS_EMAIL_SENDING_DEFAULT}
    PROJECTROLES_EMAIL_SENDER_REPLY: ${KIOSC_PROJECTROLES_EMAIL_SENDER_REPLY}
    PROJECTROLES_SEND_EMAIL: ${KIOSC_PROJECTROLES_SEND_EMAIL}
    SODAR_EMAIL_SENDER: ${KIOSC_SODAR_EMAIL_SENDER}
    SODAR_EMAIL_SUBJECT_PREFIX: ${KIOSC_SODAR_EMAIL_SUBJECT_PREFIX}
    SODAR_EMAIL_URL: ${KIOSC_SODAR_EMAIL_URL}
    # Site settings
    SITE_TITLE: ${KIOSC_SITE_TITLE}
    SITE_SUBTITLE: ${KIOSC_SITE_SUBTITLE}
    SITE_INSTANCE_TITLE: ${KIOSC_SITE_INSTANCE_TITLE}
    ADMINS: ${KIOSC_ADMINS}
    # Logging settings
    LOGGING_LEVEL: ${KIOSC_LOGGING_LEVEL}
    LOGGING_FILE_PATH: ${KIOSC_LOGGING_FILE_PATH}
    # REST API settings
    PROJECTROLES_API_USER_DETAIL_RESTRICT: ${KIOSC_PROJECTROLES_API_USER_DETAIL_RESTRICT}
    TOKENS_CREATE_PROJECT_USER_RESTRICT: ${KIOSC_TOKENS_CREATE_PROJECT_USER_RESTRICT}
    # Other SODAR Core settings
    PROJECTROLES_ALLOW_ANONYMOUS: ${KIOSC_PROJECTROLES_ALLOW_ANONYMOUS}
    PROJECTROLES_ALLOW_LOCAL_USERS: ${KIOSC_PROJECTROLES_ALLOW_LOCAL_USERS}
    PROJECTROLES_CUSTOM_CSS_INCLUDES: ${KIOSC_PROJECTROLES_CUSTOM_CSS_INCLUDES}
    PROJECTROLES_CUSTOM_JS_INCLUDES: ${KIOSC_PROJECTROLES_CUSTOM_JS_INCLUDES}
    PROJECTROLES_DEFAULT_ADMIN: ${KIOSC_PROJECTROLES_DEFAULT_ADMIN}
    PROJECTROLES_DELEGATE_LIMIT: ${KIOSC_PROJECTROLES_DELEGATE_LIMIT}
    PROJECTROLES_DISABLE_CDN_INCLUDES: ${KIOSC_PROJECTROLES_DISABLE_CDN_INCLUDES}
    PROJECTROLES_INLINE_HEAD_INCLUDE: ${KIOSC_PROJECTROLES_INLINE_HEAD_INCLUDE}
    PROJECTROLES_READ_ONLY_MSG: ${KIOSC_PROJECTROLES_READ_ONLY_MSG}
    PROJECTROLES_SITE_MODE: ${KIOSC_PROJECTROLES_SITE_MODE}
    PROJECTROLES_SUPPORT_CONTACT: ${KIOSC_PROJECTROLES_SUPPORT_CONTACT}
    PROJECTROLES_TARGET_CREATE: ${KIOSC_PROJECTROLES_TARGET_CREATE}
    PROJECTROLES_TARGET_SYNC_ENABLE: ${KIOSC_PROJECTROLES_TARGET_SYNC_ENABLE}
    PROJECTROLES_TARGET_SYNC_INTERVAL: ${KIOSC_PROJECTROLES_TARGET_SYNC_INTERVAL}
  env_file:
    - .env
  networks:
    - kiosc-public
  restart: unless-stopped
  volumes:
    - type: bind
      source: /var/run/docker.sock
      target: /var/run/docker.sock
      read_only: false

services:
  postgres:
    <<: *default-postgres
    profiles: [deploy]

  postgres-dev:
    <<: *default-postgres
    profiles: [dev]
    ports:
      - "5432:5432"

  redis:
    <<: *default-redis
    profiles: [deploy]

  redis-dev:
    <<: *default-redis
    profiles: [dev]
    ports:
      - "6379:6379"

  kiosc-registry:
    <<: *default-registry
    networks:
      - kiosc-public
    ports:
      - "5000:5000"
    profiles: [deploy]
    depends_on:
      - redis

  kiosc-registry-dev:
    <<: *default-registry
    environment:
      <<: *default-registry-environment
      REGISTRY_HTTP_DEBUG_ADDR: ":5001"
      REGISTRY_LOG_LEVEL: "debug"
    # Need to be in the host network in order to access the kiosc-web server
    network_mode: host
    extra_hosts:
      - "kiosc-web:127.0.0.1"
    profiles: [dev]
    depends_on:
      - redis-dev

  traefik:
    image: traefik:${TRAEFIK_VERSION-v3}
    profiles: [deploy]
    ports:
      - "80:80"
      - "443:443"
    networks:
      - kiosc-public
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=kiosc-docker-compose_kiosc-public"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true

  kiosc-web:
    <<: *default-kiosc
    profiles: [deploy]
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.xforward.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.kiosc-web.entrypoints=web,websecure"
      - "traefik.http.routers.kiosc-web.middlewares=xforward"
      - "traefik.http.routers.kiosc-web.rule=HostRegexp(`.+`)"
      - "traefik.http.services.kiosc-web.loadbalancer.server.port=8000"
      - "traefik.http.routers.kiosc-web.tls=true"

  kiosc-celerybeat:
    <<: *default-kiosc
    profiles: [deploy]
    command: ["celerybeat"]
    depends_on:
      - kiosc-web
    restart: unless-stopped

  kiosc-celeryd-default:
    <<: *default-kiosc
    profiles: [deploy]
    command: ["celeryd"]
    environment:
      <<: *default-kiosc-environment
      CELERY_QUEUES: default
      CELERY_WORKERS: 16
    depends_on:
      - kiosc-web
    restart: unless-stopped

networks:
  kiosc-public:
    driver_opts:
      com.docker.network.bridge.name: ${NETWORK_BRIDGE_NAME:-br-kiosc-public}
